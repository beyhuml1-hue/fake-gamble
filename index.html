    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- When both domains share the same Cloudflare Pages output, send only the LARP subdomain to its standalone site. -->
    <script>
      if (location.hostname.toLowerCase() === "larp.playblockbet.com" && !location.pathname.startsWith("/larp/")) {
        location.replace("/larp/" + location.search + location.hash);
      }
    </script>
